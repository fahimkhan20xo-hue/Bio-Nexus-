name: Sync species database

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'database/names.txt'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch species details
        run: python sync_species.py

      - name: Commit updated database
        run: |
          git config user.name "bionexus-bot"
          git config user.email "bionexus-bot@users.noreply.github.com"
          git add database
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync species database"
            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push && exit 0
              echo "Push attempt $i failed, retrying in 5 seconds..."
              sleep 5
            done
            exit 1
          fi
