name: Build BioNexus APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name=bionexus

      - name: Allow internet access in release APK
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"
          fi
          grep -n "INTERNET" "$MANIFEST"

      - name: Debug Dart files
        run: |
          echo "Dart files:"
          find . -type f \( -name 'main.dart' -o -name 'quiz.dart' -o -name 'data.dart' \) -print
          echo "lib directory:"
          ls -la lib/
          echo "Check quiz.dart:"
          test -f lib/quiz.dart && echo "quiz.dart EXISTS" || echo "quiz.dart MISSING"
          grep -n "class QuizPage" lib/quiz.dart || true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BioNexus-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
