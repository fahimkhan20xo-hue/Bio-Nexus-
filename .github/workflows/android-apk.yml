name: Build BioNexus APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'database/**'
      - 'sync_species.py'
      - '.github/workflows/sync-species.yml'
      - '**.md'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore permanent signing key
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret DEBUG_KEYSTORE_BASE64 is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore

      - name: Generate Android platform files
        run: flutter create . --platforms=android --project-name=bionexus

      - name: Check the signing key and force Gradle to use it
        run: |
          KS="$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey | grep -E "Alias name|Owner|SHA256"
          KEYSTORE_FP=$(keytool -list -v -keystore "$KS" -storepass android -alias androiddebugkey | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "KEYSTORE_FP=$KEYSTORE_FP" >> "$GITHUB_ENV"
          echo "Keystore SHA-256: $KEYSTORE_FP"
          echo "" >> android/gradle.properties
          echo "android.injected.signing.store.file=$KS" >> android/gradle.properties
          echo "android.injected.signing.store.password=android" >> android/gradle.properties
          echo "android.injected.signing.key.alias=androiddebugkey" >> android/gradle.properties
          echo "android.injected.signing.key.password=android" >> android/gradle.properties

      - name: Allow internet access in release APK
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '0,/<application/s//<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' "$MANIFEST"
          fi
          grep -n "INTERNET" "$MANIFEST"

      - name: Allow text-to-speech engine lookup
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "TTS_SERVICE" "$MANIFEST"; then
            sed -i '0,/<application/s//<queries>\n        <intent>\n            <action android:name="android.intent.action.TTS_SERVICE"\/>\n        <\/intent>\n    <\/queries>\n    <application/' "$MANIFEST"
          fi
          grep -n "TTS_SERVICE" "$MANIFEST"

      - name: Add url_launcher and flutter_tts
        run: flutter pub add url_launcher flutter_tts

      - name: Debug Dart files
        run: |
          echo "Dart files:"
          find . -type f \( -name 'main.dart' -o -name 'quiz.dart' -o -name 'data.dart' \) -print
          echo "lib directory:"
          ls -la lib/
          echo "Check quiz.dart:"
          test -f lib/quiz.dart && echo "quiz.dart EXISTS" || echo "quiz.dart MISSING"
          grep -n "class QuizPage" lib/quiz.dart || true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }} --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Show APK signing certificate
        continue-on-error: true
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          FP=$("$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "certificate SHA-256 digest" | head -1 | awk '{print $NF}')
          echo "Signing certificate SHA-256: $FP"
          echo "CERT_FP=$FP" >> "$GITHUB_ENV"
          if [ "$FP" != "$KEYSTORE_FP" ]; then
            echo "::warning::The APK is NOT signed with the restored keystore (APK $FP, keystore $KEYSTORE_FP)"
          else
            echo "OK: the APK is signed with the restored keystore."
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BioNexus-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Publish release (used by the in-app update check)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-release.apk BioNexus.apk
          NOTES="Automatic build ${{ github.run_number }}. Signing certificate SHA-256: ${CERT_FP:-unknown}"
          for i in 1 2 3 4 5; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" BioNexus.apk --clobber && exit 0
            else
              gh release create "$TAG" BioNexus.apk --title "BioNexus build ${{ github.run_number }}" --notes "$NOTES" --latest && exit 0
            fi
            echo "Attempt $i failed (GitHub may be busy). Retrying in 20 seconds..."
            sleep 20
          done
          exit 1
          
